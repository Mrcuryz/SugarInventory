services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_ENV: production
      AGENT_TOOL_MODE: java_gateway
      AGENT_MODEL_MODE: basic
      JAVA_TOOL_GATEWAY_BASE_URL: http://backend:8080
      AGENT_STATE_BACKEND: redis
      AGENT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AGENT_ALLOW_INSECURE_MOCK_AUTH: "false"
    depends_on:
      redis:
        condition: service_healthy

  backend:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    environment:
      AGENT_RUNTIME_MODE: python
      AGENT_PYTHON_BASE_URL: http://agent:8091
      AGENT_RUNTIME_FALLBACK_ENABLED: "false"
      AGENT_MCP_JAR_PATH: /app/warehouse-mcp/warehouse-mcp.jar
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ./artifacts/app.jar:/app/app.jar:ro
      - ./artifacts/warehouse-mcp.jar:/app/warehouse-mcp/warehouse-mcp.jar:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      agent:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./artifacts/dist:/usr/share/nginx/html:ro
      - ./cert:/etc/nginx/cert:ro
    depends_on:
      - backend

volumes:
  redis_data:
