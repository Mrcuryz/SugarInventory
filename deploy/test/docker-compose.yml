name: laibin-demo
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Run init-env.sh first}
      MYSQL_DATABASE: laibin_demo
      TZ: Asia/Shanghai
    command: ["--innodb-buffer-pool-size=512M", "--max-connections=80", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/snapshot.sql:/docker-entrypoint-initdb.d/01-snapshot.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -uroot -Dlaibin_demo -Nse 'SELECT COUNT(*) FROM user' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  migration:
    image: mysql:8.0
    profiles: ["operations"]
    env_file: .env
    entrypoint: ["sh", "/database/apply-migrations.sh"]
    volumes:
      - ./apply-migrations.sh:/database/apply-migrations.sh:ro
      - ./artifacts/database/migrations:/migrations:ro
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_ENV: production
      AGENT_TOOL_MODE: java_gateway
      AGENT_PYTHON_MODEL_MODE: openai_compatible
      AGENT_PLANNING_MODE: llm
      JAVA_TOOL_GATEWAY_BASE_URL: http://backend:8080
      AGENT_STATE_BACKEND: redis
      AGENT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AGENT_ALLOW_INSECURE_MOCK_AUTH: "false"
      AGENT_RAG_ENABLED: "true"
      AGENT_RAG_REQUIRED: "true"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./artifacts/rag:/app/rag:ro
      - ./artifacts/rag-model:/app/rag-model:ro

  backend:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    environment:
      AGENT_RUNTIME_MODE: python
      AGENT_PYTHON_BASE_URL: http://agent:8091
      AGENT_RUNTIME_FALLBACK_ENABLED: "false"
      AGENT_MCP_JAR_PATH: /app/warehouse-mcp/warehouse-mcp.jar
      AGENT_MCP_API_BASE_URL: http://127.0.0.1:8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DATABASE_SCHEMA_VERIFICATION_ENABLED: "true"
      DEMO_PRIVACY_ENABLED: "true"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
      FILE_EXPORT_DIR: /app/exports
      FILE_BASE_URL: http://${DEMO_PUBLIC_IP}
    command: ["java", "-Xmx1536m", "-jar", "/app/app.jar"]
    volumes:
      - ./artifacts/app.jar:/app/app.jar:ro
      - ./artifacts/warehouse-mcp.jar:/app/warehouse-mcp/warehouse-mcp.jar:ro
      - export_data:/app/exports
    depends_on:
      mysql:
        condition: service_healthy
      agent:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./artifacts/dist:/usr/share/nginx/html:ro
    depends_on: [backend]

volumes:
  mysql_data:
  redis_data:
    name: laibin-demo_redis_demo_privacy_v1
  export_data:
    name: laibin-demo_exports_demo_privacy_v1
