[project]
name = "warehouse-agent-service"
version = "0.2.0"
description = "Python FastAPI Agent Runtime for the Laibin smart warehouse assistant."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "redis>=5.0,<7.0",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
run = [
  "uvicorn>=0.30,<1.0",
]
langgraph = [
  "langgraph>=0.2,<2.0",
]
rag-build = [
  "fastembed==0.8.0",
  "httpx>=0.28.1,<1.0",
  "lxml>=6.1.1,<7.0",
  "numpy>=2.0,<3.0",
  "onnxruntime==1.23.2",
  "Pillow>=12.3.0,<13.0",
  "pypdf>=6.14.2,<7.0",
  "rapidocr==3.9.2",
]
rag-runtime = [
  "fastembed==0.8.0",
  "numpy>=2.0,<3.0",
  "onnxruntime==1.23.2",
]
test = [
  "pytest>=8.0",
  "httpx>=0.28.1,<1.0",
  "httpx2>=2.5,<3.0",
  "lxml>=6.1.1,<7.0",
  "numpy>=2.0,<3.0",
  "Pillow>=12.3.0,<13.0",
  "pypdf>=6.14.2,<7.0",
  "PyYAML>=6.0,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
