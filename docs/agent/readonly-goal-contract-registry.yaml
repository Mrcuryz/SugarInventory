principles:
  - "GoalContract 按用户业务结果登记，不按工具数量一对一生成。"
  - "primary_tools 能直接形成完成事实；supporting_tools 只负责解析、目录发现或详情下钻。"
  - "Runtime 中 evidenceTools 必须与 primary_tools 一致；supporting_tools 不得生成目标完成证据。"
  - "CURRENT 表示已进入 Runtime GoalContract、FactEnvelope 和 CompletionEvaluator。"
  - "PLANNED 表示工具已经可用但目标合同尚未进入 Runtime；当前 planned_goals 为空。"
  - "同一工具可以在一个目标中作为主查询工具，在另一个目标中作为支撑工具。"
  - "search_approved_knowledge 是 Python 进程内 L0 能力，不计入 52 个仓储 MCP/登记报表工具。"

