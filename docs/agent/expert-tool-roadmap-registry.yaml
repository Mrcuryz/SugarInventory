version: agent-tool-roadmap-2026-08-03-r3
status: DESIGN_ONLY
runtime_enabled: false
runtime_effect: "NONE；本文件不是 Python 专家白名单，也不是 Java Gateway 或 warehouse-mcp 注册表。"
source_of_design: "docs/mcp-analysis/agent-expert-tool-blueprint.md"
related_design_registries:
  recipeRoadmap: "docs/agent/cross-expert-recipe-roadmap-registry.yaml"
  dataSemanticRoadmap: "docs/agent/data-semantic-roadmap-registry.yaml"
  businessRuleRoadmap: "docs/agent/business-rule-roadmap-registry.yaml"

release_boundaries:
  v1:
    allowed_risk_levels: [L0, L1]
    behavior: "模块专家只读查询；原有 17 个工具行为保持不变，当前共登记 47 个只读工具。"
  v2_analytics:
    allowed_risk_levels: [L1, L2]
    behavior: "登记数据集、确定性报表、趋势/对比和 dry-run preview。"
  v2_write:
    allowed_risk_levels: [L3, L4]
    behavior: "仅 preview -> HITL -> execute；execute 不接收可变业务参数。"
  v2_planning:
    allowed_risk_levels: [L2]
    behavior: "预测、优化和仿真只生成 advisory scenarios；不得生成 executionToken 或直接写业务。"

global_rules:
  main_agent_business_tools: []
  arbitrary_sql: FORBIDDEN
  arbitrary_http: FORBIDDEN
  free_form_dag: FORBIDDEN
  free_multi_agent_conversation: FORBIDDEN
  runtime_default_for_new_entries: disabled
  channel_group_execute: FORBIDDEN
  planning_result_as_execution_token: FORBIDDEN
  llm_final_business_decision: FORBIDDEN
  activation_gate:
    - java_aggregate_api
    - java_gateway_rbac_and_allowlist
    - warehouse_mcp_schema
    - python_owner_expert_allowlist
    - capability_registry
    - deterministic_tests
    - safe_formatter
    - documentation
    - startup_hash_handshake

