registered_dataset_placeholders:
  - inventory_snapshot_v1
  - stock_movement_v1
  - production_order_fact_v1
  - production_output_fact_v1
  - quality_assay_fact_v1
  - pallet_lifecycle_fact_v1
  - agent_audit_fact_v1

registered_cross_domain_report_placeholders:
  - id: daily_production_overview_v1
    runtime_registered: true
    version: 1
    data_scope: REGISTERED_PRODUCTION_OUTPUT
    owner_expert: analytics_expert
    limitations:
      - no_plan_attainment
      - no_shift_comparison
      - no_yield_or_loss_rate
  - id: quality_assay_result_trend_v1
    runtime_registered: true
    version: 1
    data_scope: REGISTERED_QUALITY_ASSAY
    owner_expert: analytics_expert
    limitations:
      - no_missing_historical_assay_inference
      - no_current_standard_recalculation
      - no_causal_quality_conclusion
  - id: quality_metric_trend_v1
    runtime_registered: true
    version: 1
    data_scope: REGISTERED_QUALITY_ASSAY_METRIC
    owner_expert: analytics_expert
    limitations:
      - no_cross_unit_comparison
      - no_current_standard_recalculation
      - no_small_sample_trend_claim
      - no_causal_quality_conclusion
  - id: production_input_output_flow_v1
    runtime_registered: true
    version: 1
    data_scope: REGISTERED_PRODUCTION_INPUT_OUTPUT_FLOW
    owner_expert: analytics_expert
    limitations:
      - material_pick_is_not_consumption
      - independent_calendar_series_must_not_be_divided
      - semi_product_usage_is_final_confirmation_not_actual_feed_time
      - product_scope_requires_stable_registered_output
      - no_yield_or_loss_rate
  - id: pallet_task_cycle_time_v1
    runtime_registered: true
    version: 1
    data_scope: REGISTERED_PALLET_TASK_CYCLE_TIME
    owner_expert: analytics_expert
    limitations:
      - completed_duration_and_pending_waiting_are_separate
      - canceled_tasks_have_no_terminal_duration
      - no_registered_sla
      - no_employee_performance_or_causal_conclusion
  - id: inventory_level_trend_v1
    runtime_registered: true
    version: 1
    data_scope: TRUSTED_DAILY_CLOSE_SNAPSHOT_OR_EXPLICIT_LOCAL_REPLAY
    owner_expert: analytics_expert
    limitations:
      - local_replay_is_not_production_release_evidence
      - no_historical_warehouse_distribution
      - no_causal_or_forecast_conclusion
  - id: today_operations_overview_v1
    runtime_registered: true
    version: 1
    data_scope: REGISTERED_TODAY_OPERATIONS_SNAPSHOT
    owner_expert: analytics_expert
    limitations:
      - beijing_today_only
      - current_inventory_and_pending_tasks_are_generation_time_snapshots
      - material_pick_and_stable_output_series_must_not_be_divided
      - no_plan_attainment_yield_loss_sla_or_forecast
  - id: inventory_quality_overview_v1
    runtime_registered: false
    semantics:
      data_scope: PRODUCT_LATEST_ASSAY
      batch_qualification_supported: false
  - id: production_material_output_reconciliation_v1
    runtime_registered: false
    blocked_by: [yield_formula, unit_conversion_rules]
  - id: warehouse_flow_efficiency_v1
    runtime_registered: false
    blocked_for_history_by: [warehouse_capacity_snapshot]

future_infrastructure:
  channelIntegrationGateway:
    status: DESIGN_ONLY
    adapters: [WECHAT_WORK, DINGTALK]
    groupAllowedCapabilities: [QUERY, REGISTERED_REPORT, NOTIFICATION, WEB_CONFIRMATION_LINK]
    groupForbiddenCapabilities: [L3_EXECUTE, L4_EXECUTE, HITL_EXECUTE_RESUME]
    requirements:
      - signed_callback_verification
      - verified_user_mapping
      - message_deduplication
      - attachment_quarantine
      - group_safe_data_classification
      - private_or_web_fallback_for_sensitive_data
      - channel_audit
  asyncJobModel:
    status: DESIGN_ONLY
    states: [QUEUED, RUNNING, WAITING_HITL, SUCCEEDED, PARTIAL_FAILED, FAILED, CANCELLED, EXPIRED]
    retryRule: "仅登记为幂等且可重试的步骤允许自动重试。"
    compensationRule: "仅登记补偿动作；禁止通用回滚和反向 SQL。"
  futureScopes:
    status: RESERVED_NOT_ACTIVE
    fields: [organizationScope, plantScope, warehouseAreaScope]
    source: trusted_identity_and_rbac
  modelGovernance:
    status: DESIGN_ONLY
    approvalStates: [DRAFT, EVALUATED, APPROVED_FOR_ADVISORY, SUSPENDED, RETIRED]
    directBusinessExecution: FORBIDDEN

forbidden_capabilities:
  - manage_reference_data
  - arbitrary_sql_report
  - arbitrary_http_request
  - direct_inventory_update
  - legacy_semi_prepare_write
  - legacy_semi_consume_write
  - legacy_output_qr_bind
  - local_printer_control
  - authentication_or_account_binding
  - business_audit_log_mutation
