      - "用户问产品在哪些库位、库存分布、按库位/产品聚合。"
      - "用户问某库位有什么、有啥、放了什么、有哪些产品。"
      - "用户明确问全部产品受控聚合，或已确认库位下的全部产品。"
    do_not_use_when:
      - "用户只问某库位容量、占用率或是否满仓。"
      - "用户只问单产品总库存且不关心分布。"
      - "缺少产品范围且也没有库位范围。"
      - "用户要求写操作或报表导出。"
    required_slots:
      - "product_scope"
      - "warehouse_scope"
      - "group_by"
    optional_slots:
      - "status_filter"
      - "limit"
    resolver_for: []
    main_query_for:
      - "resolve_products"
      - "resolve_warehouses"
    default_behavior: "库位内容查询使用 productScope=ALL、已确认 warehouseScope、groupBy=product；单产品位置查询使用已确认产品范围、warehouseScope=ALL、groupBy=warehouse。"
    data_semantics:
      - "化验状态通过当前库存产品 ID + 批次生产日期关联同批次最新版本化验：托盘库存使用 pallet_code.production_date，非托盘库存兼容回退 inventory.entry_date；不得使用 inventory.assay_id。"
      - "最新版本按 version、created_at、id 倒序确定；库存先入库而化验尚未产生时必须保留为无化验。"
    examples:
      - input: "1号库位有什么？"
        chain: "resolve_warehouses -> get_inventory_distribution(productScope=ALL, warehouseScope=已确认库位, groupBy=product)"
      - input: "黄冰糖（袋）在哪些库位？"
        chain: "resolve_products -> get_inventory_distribution(productScope=已确认产品, warehouseScope=ALL, groupBy=warehouse)"
      - input: "全部产品无化验库存统计"
        chain: "get_inventory_distribution(productScope=ALL, warehouseScope=ALL, statusFilter.assayStatus=MISSING_ASSAY, groupBy=product)"
    anti_examples:
      - input: "1号库位满了吗？"
        reason: "应使用 get_warehouse_status。"
      - input: "导出库存报表"
        reason: "当前没有导出工具。"
    safe_result_summary:
      - "scopeLabel"
      - "totalStockText"
      - "warehouseCount"
      - "productCount"
      - "palletCount"
      - "riskLabels"
      - "cards"
    unsupported_alternatives:
