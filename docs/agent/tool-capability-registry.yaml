version: m1.5r-l2-preview01
scope: "Agent Runtime Playbook + Tool Capability Registry + LLM Wiki Lite"
principles:
  - "本 registry 描述业务能力和工具选择边界，不替代 MCP schema。"
  - "实时库存、库位、托盘、化验事实必须通过 MCP / 后端只读工具查询。"
  - "resolver 只确认业务对象，不能作为最终业务答案。"
  - "普通用户回答不得展示 toolName、productId、warehouseId、raw JSON、SUCCESS、token、Authorization、堆栈或 chain-of-thought。"
  - "当前阶段不执行入库、出库、调拨、改库存、化验写入、基础资料修改或生产订单写入。"

agent_v1_reaudit:
  status: "DESIGN_ONLY"
  source: "前端菜单/路由 + webpage API + 后端 Controller；docs/openapi.json 当前缺失。"
  finding: "当前 52 个只读/登记报表工具与 1 个无写入 L2 任务预览工具已完成已登记专家的运行时规划集；run_registered_report 目前受控运行七个版本化确定性报表定义，不接受模型创建任意报表。"
  target_expert_domains:
    - inventory
    - warehouse
    - logistics
    - pallet
    - production
    - quality
    - master_data
    - administration
    - audit
    - analytics
  runtime_rule: "目标专家域在相应工具完成全链路实现、测试和登记前，不得加入运行时白名单。"
  detail: "docs/mcp-analysis/agent-v1-module-expert-reaudit.md"

expert_tool_roadmap:
  status: "DESIGN_ONLY"
  runtime_enabled: false
  scope: "Agent v1 模块查询工具 + Agent v2 登记报表/分析 + preview/execute 写入占位 + 后续规划/预测/渠道治理。"
  blueprint: "docs/mcp-analysis/agent-expert-tool-blueprint.md"
  registry: "docs/agent/expert-tool-roadmap-registry.yaml"
  recipe_roadmap: "docs/agent/cross-expert-recipe-roadmap-registry.yaml"
  data_semantic_roadmap: "docs/agent/data-semantic-roadmap-registry.yaml"
  business_rule_roadmap: "docs/agent/business-rule-roadmap-registry.yaml"
  runtime_rule: "roadmap 中除 CURRENT 外的工具均不是当前能力；不得据此扩大现有 52 个 L1 只读/登记报表工具、1 个 L2 任务预览工具、专家白名单或配方注册表。"

agent_architecture:
  main_agent:
    responsibilities:
      - "意图识别、上下文、HITL、安全边界和最终自然语言回答。"
      - "通过 Agent Handoff Router 把单模块任务交给一个最小权限专家。"
      - "对已登记的复合意图生成有界依赖图，按步骤委派多个最小权限专家。"
    allowed_tools: []
  handoff_rules:
    - "普通业务工具只能由目标专家调用，主 Agent 不直接调用 MCP 业务工具。"
    - "规划时和 Java Gateway 调用前都必须按不可变的单次执行上下文校验专家工具白名单。"
    - "模型选择越界工具时直接拒绝，不自动改派给其他专家。"
    - "HITL 恢复绑定创建它的专家、业务域和工具白名单。"
    - "同一 agentSessionId 的请求串行执行；普通 SSE 不暴露完整 Router/Handoff 快照。"
    - "多专家只能执行代码中登记的复合配方；每一步重新绑定不可变专家上下文，主 Agent 仍无业务工具。"
    - "复合配方最多 4 步、12 次工具调用、5 个产品扇出，部分失败必须明确反馈。"
    - "写操作和未支持能力不委派执行，由主 Agent说明安全边界。"
    - "生产使用 Redis StateStore 与分布式 SessionLock；恢复必须通过计划版本、指纹与权限快照校验。"
  compound_recipes:
    warehouse_inventory_latest_assay:
      recipe_id: warehouse_inventory_latest_assay
      plan_version: 1
      execution_mode: controlled_sequential
      trigger: "明确询问某库位库存情况及这些产品的化验情况。"
      steps:
        - "inventory_expert: resolve_warehouses -> get_inventory_distribution(groupBy=product)"
        - "assay_expert: resolve_products -> query_assay_records(size=1)，依赖库存产品范围"
        - "main_agent: 汇总安全结果，不调用业务工具"
      limits:
        max_steps: 4
        max_tool_calls: 12
        max_product_fanout: 5
      result_boundary:
        - "dataScope 固定为 PRODUCT_LATEST_ASSAY，batchQualificationSupported 固定为 false。"
        - "当前只表示按产品匹配的最新化验记录。"
        - "没有批次级关联键时，不得宣称当前库存批次均已化验或均合格。"
  experts:
    inventory_expert:
      domains: ["inventory", "product"]
      allowed_tools: ["resolve_products", "resolve_warehouses", "get_inventory_overview", "get_inventory_distribution", "query_inventory_ledger"]
      model_policy_key: "inventory"
    warehouse_expert:
      domains: ["warehouse"]
      allowed_tools: ["resolve_warehouses", "get_warehouse_status", "query_warehouse_capacity_distribution", "query_warehouse_recent_operations", "query_warehouse_mixed_storage_facts"]
      model_policy_key: "warehouse"
    assay_expert:
      domains: ["assay", "quality"]
      allowed_tools: ["resolve_products", "resolve_warehouses", "get_assay_status", "query_assay_records", "get_assay_report_detail", "query_assay_abnormalities", "query_products_without_recent_assay", "query_assay_standard_coverage", "query_unqualified_inventory", "query_inventory_by_quality_standard", "query_inventory_by_assay_metrics", "query_assay_groups", "query_quality_standard_catalog", "get_quality_standard_detail", "query_product_standard_relations", "query_product_quality_configuration"]
      model_policy_key: "assay"
    pallet_expert:
      domains: ["pallet", "qr_code"]
      allowed_tools: ["resolve_products", "resolve_warehouses", "get_pallet_status", "query_qr_code_lifecycle", "query_printed_not_inbound_codes", "query_pallet_anomalies", "query_pallet_flow_records", "query_qr_batch_inbound_completion", "query_fixed_product_qr_pool"]
      model_policy_key: "pallet"
    production_expert:
      domains: ["production"]
      allowed_tools: ["resolve_production_entities", "query_boiling_batches", "query_production_order_progress", "query_boiling_batch_trace", "query_material_pick_trace", "query_production_label_completion", "query_in_process_materials", "query_material_candidates"]
      model_policy_key: "production"
    analytics_expert:
      domains: ["analytics", "report"]
      allowed_tools: ["run_registered_report"]
      model_policy_key: "analytics"
    master_data_expert:
      domains: ["master_data", "product_catalog", "screen_mesh"]
      allowed_tools: ["resolve_products", "query_product_catalog", "get_product_detail", "query_screen_mesh_catalog"]
      model_policy_key: "master_data"
    logistics_expert:
      domains: ["logistics", "task", "document", "auto_inbound"]
      allowed_tools: ["resolve_products", "resolve_warehouses", "query_pallet_tasks", "query_fixed_product_qr_pool", "preview_task_transition", "preview_finish_inbound_execution", "query_stock_documents", "query_auto_inbound_batches", "get_auto_inbound_batch_detail"]
      model_policy_key: "logistics"
    administration_expert:
      domains: ["administration", "employee", "rbac"]
      allowed_tools: ["query_employee_roster", "query_roles", "get_role_permission_summary"]
      model_policy_key: "administration"
    audit_expert:
      domains: ["audit", "operation_log"]
      allowed_tools: ["search_operation_logs", "query_agent_tool_audit", "query_agent_answer_reviews"]
      model_policy_key: "audit"
    knowledge_expert:
      domains: ["knowledge", "process_knowledge", "enterprise_knowledge"]
      allowed_tools: ["search_approved_knowledge"]
      model_policy_key: "knowledge"
      tool_plane: "agent_process_local"
      risk_level: "L0"
      permission: "ADMIN"
      boundary: "不进入 Java Gateway/MCP 的 52 个 L1 工具注册表；仅检索已审核、已激活的本地知识库版本。"

tools:
  query_fixed_product_qr_pool:
    business_name: "固定产品二维码池查询"
    risk_level: "L1"
    owner_expert: "pallet_expert"
    can_answer: ["按产品、有限二维码列表、状态和 freeOnly 查询固定产品码池当前状态及可打印事实。"]
    cannot_answer: ["allowPrint 不表示已打印、已启用或已创建任务；不能执行绑定、打印、启用、作废、恢复或库存操作。"]
    permission: "qrcode:pool_view"
    data_scope: "CURRENT_FIXED_PRODUCT_QR_POOL"

  query_inventory_ledger:
    business_name: "当前库存台账明细"
    risk_level: "L1"
    owner_expert: "inventory_expert"
    can_answer: ["按产品、库位、筛网、状态和入库日期查询当前库存行、位置、板件数与已登记生产日期。"]
    cannot_answer: ["不是完整历史流水；不能把生产日期为空解释为异常，也不能证明库存批次质量合格。"]
    permission: "inventory:view"
    data_scope: "CURRENT_INVENTORY_LEDGER_ROWS"
  search_operation_logs:
    business_name: "业务操作日志查询"
    risk_level: "L1"
    owner_expert: "audit_expert"
    can_answer: ["按模块、操作类型、操作人和时间查询已登记日志及变更字段名称。"]
    cannot_answer: ["不能返回 oldData、字段值、请求正文、凭据或原始异常，也不能证明未登记操作从未发生。"]
    permission: "log:view"
    data_scope: "RECORDED_BUSINESS_OPERATION_LOGS"
  query_agent_tool_audit:
    business_name: "Agent 工具调用审计"
    risk_level: "L1"
    owner_expert: "audit_expert"
    can_answer: ["查询已登记能力调用的结果类别、错误类别、耗时和时间。"]
    cannot_answer: ["不能返回会话/用户/消息/调用内部 ID、路径、参数、请求响应摘要、Prompt、模型上下文、密钥或堆栈。"]
    permission: "agent:audit:view"
    data_scope: "RECORDED_AGENT_TOOL_AUDIT"
  query_agent_answer_reviews:
    business_name: "Agent 回答复核摘要"
    risk_level: "L1"
    owner_expert: "audit_expert"
    can_answer: ["查询回答状态、置信度、失败分类、建议修复类型与 Review 状态。"]
    cannot_answer: ["不能返回用户原问题、助手原回答、工具名、决策快照、证据正文或内部身份。"]
    permission: "agent:review:view"
    data_scope: "AGENT_ANSWER_REVIEW_SAFE_SUMMARY"

  query_employee_roster:
    business_name: "员工名册查询"
    risk_level: "L1"
    owner_expert: "administration_expert"
    can_answer: ["按工号、姓名、部门、职位、状态或角色查询当前员工名册，手机号仅返回掩码。"]
    cannot_answer: ["不能返回内部记录 ID、完整手机号、登录凭据、微信绑定信息或鉴权令牌，也不能证明员工当前在岗。"]
    required_slots: []
    permission: "rbac:user:view"
    data_scope: "CURRENT_EMPLOYEE_ROSTER"
  query_roles:
    business_name: "角色目录查询"
    risk_level: "L1"
    owner_expert: "administration_expert"
    can_answer: ["查询当前角色名称、编码、状态及权限/在职员工汇总数量。"]
    cannot_answer: ["不能返回内部角色或权限 ID、员工姓名清单，也不代表请求者自动拥有这些权限。"]
    required_slots: []
    permission: "rbac:role:view"
    data_scope: "CURRENT_RBAC_ROLE_CATALOG"
  get_role_permission_summary:
    business_name: "角色权限摘要"
    risk_level: "L1"
    owner_expert: "administration_expert"
    can_answer: ["按准确角色编码或名称查询当前业务权限代码、名称与分组摘要。"]
    cannot_answer: ["不能返回内部权限 ID、Agent 工具白名单、模型上下文或密钥；实际访问仍需重新鉴权。"]
    required_slots: ["role_code_or_name"]
    permission: "rbac:role:view"
    data_scope: "CURRENT_RBAC_ROLE_PERMISSION_SUMMARY"

  query_assay_groups:
    business_name: "化验组目录"
    risk_level: "L1"
    owner_expert: "assay_expert"
    can_answer: ["查询当前化验产品分组配置。"]
    cannot_answer: ["不能解释为标准、合格结论或库存批次范围。"]
    permission: "assay:view"
    data_scope: "CURRENT_ASSAY_GROUP_CATALOG"
  query_quality_standard_catalog:
    business_name: "质量标准目录"
    risk_level: "L1"
    owner_expert: "assay_expert"
    can_answer: ["查询当前标准代码、名称、品类、等级、版本和状态。"]
    cannot_answer: ["不能证明某次化验采用该标准。"]
    permission: "quality_standard:view"
    data_scope: "CURRENT_QUALITY_STANDARD_CATALOG"
  get_quality_standard_detail:
    business_name: "质量标准详情"
    risk_level: "L1"
    owner_expert: "assay_expert"
    can_answer: ["按标准代码和版本查询指标配置与关联产品摘要。"]
    cannot_answer: ["LLM 不作最终质量判定。"]
    required_slots: ["standard_code", "version"]
    permission: "quality_standard:view"
    data_scope: "CURRENT_QUALITY_STANDARD_DETAIL"
  query_product_standard_relations:
    business_name: "产品质量标准关系"
    risk_level: "L1"
    owner_expert: "assay_expert"
    can_answer: ["查询准确产品当前绑定标准、默认项、优先级、启用和生效区间。"]
    cannot_answer: ["不能证明某次化验采用该标准或产品已合格。"]
    required_slots: ["product_name"]
    permission: "quality_standard:view"
    data_scope: "CURRENT_PRODUCT_QUALITY_STANDARD_RELATIONS"
  query_product_quality_configuration:
    business_name: "产品质量配置聚合查询"
    risk_level: "L1"
    owner_expert: "assay_expert"
    can_answer: ["查询已确认具体产品当前适用的质量标准和所属批量化验组。"]
    cannot_answer: ["不能把配置关系解释为某次化验采用该标准，也不能据此判定产品合格。"]
    required_slots: ["product_ref"]
    permission: "quality_standard:view + assay:view"
    data_scope: "CURRENT_PRODUCT_QUALITY_CONFIGURATION"

  query_product_catalog:
    business_name: "产品目录查询"
    risk_level: "L1"
    owner_expert: "master_data_expert"
    can_answer: ["查询当前产品名称、品类、半/成品状态、包装、换算、堆放和筛网配置。"]
    cannot_answer: ["不能解释为有库存、质量合格或生产可用，也不能修改产品配置。"]
    required_slots: []
    permission: "product:view"
    data_scope: "CURRENT_PRODUCT_MASTER_DATA"
  get_product_detail:
    business_name: "产品配置详情"
    risk_level: "L1"
    owner_expert: "master_data_expert"
    can_answer: ["按准确唯一名称查询当前产品主数据详情和配置换算摘要。"]
    cannot_answer: ["不能返回内部 ID，不能用换算配置推导库存或装载建议。"]
    required_slots: ["product_name"]
    permission: "product:view"
    data_scope: "CURRENT_PRODUCT_MASTER_DETAIL"
  query_screen_mesh_catalog:
    business_name: "筛网目录查询"
    risk_level: "L1"
    owner_expert: "master_data_expert"
    can_answer: ["查询当前筛网名称与说明。"]
    cannot_answer: ["不能解释为产品当前实际使用情况，也不能修改筛网配置。"]
    required_slots: []
    permission: "screen_mesh:view"
    data_scope: "CURRENT_SCREEN_MESH_MASTER_DATA"

  query_warehouse_mixed_storage_facts:
    business_name: "库位多产品/多规格事实"
    risk_level: "L1"
    owner_expert: "warehouse_expert"
    can_answer:
      - "查询当前同一库位存在多个产品或多个产品/筛网/状态组合的客观事实。"
    cannot_answer:
      - "不能将事实自动判定为混放违规、风险或调拨建议。"
      - "不能执行移库、调拨或库存修改。"
    required_slots: []
    permission: "warehouse:view"
    data_scope: "CURRENT_WAREHOUSE_MULTI_PRODUCT_SPEC_FACTS"

  query_warehouse_recent_operations:
    business_name: "库位近期流转"
    risk_level: "L1"
    owner_expert: "warehouse_expert"
    can_answer:
      - "按库位、时间和入库/出库/调拨类别查询已登记的托盘流转事件。"
    cannot_answer:
      - "不能解释为完整操作日志、审计日志或无缺口的历史事件账。"
      - "不能代替当前库存内容查询，也不能执行任何流转操作。"
    required_slots: []
    permission: "warehouse:view"
    data_scope: "RECORDED_WAREHOUSE_PALLET_FLOW_EVENTS"

  query_warehouse_capacity_distribution:
    business_name: "库位容量分布"
    risk_level: "L1"
    owner_expert: "warehouse_expert"
    can_answer:
      - "查询当前库位容量、占用、剩余容量、空置和满载事实。"
    cannot_answer:
      - "LOW/MEDIUM/HIGH 仅为固定展示分段，不能解释为业务风险、库位分配或调拨建议。"
      - "不能修改容量、入库、调拨或声称容量单位业务口径已经统一确认。"
    required_slots: []
    permission: "warehouse:view"
    data_scope: "CURRENT_WAREHOUSE_CAPACITY_FACTS"

  resolve_production_entities:
    business_name: "生产实体解析"
    risk_level: "L1"
    owner_expert: "production_expert"
    can_answer:
      - "按生产订单号或煮糖批次号查询候选，并返回短期、用户及权限绑定的受控引用。"
    cannot_answer:
      - "不能把内部数据库 ID 交给 Agent，也不能创建、修改或取消生产数据。"
    required_slots: ["entity_type", "query"]
    constraints:
      - "entityType 仅支持 PRODUCTION_ORDER、BOILING_BATCH；候选最多 10 个。"
      - "多候选时必须由用户提供完整编号，不得自动选择。"

  query_boiling_batches:
    business_name: "煮糖批次范围查询"
    risk_level: "L1"
    owner_expert: "production_expert"
    can_answer:
      - "按可选产品、北京时间业务日期范围和可选状态查询已登记煮糖批次，并返回受控候选引用。"
    cannot_answer:
      - "不能推断未登记批次，不能把产品名称设为日期范围查询的强制条件。"
      - "不能创建、修改、取消、预留、消耗或释放煮糖批次。"
    required_slots: []
    constraints:
      - "用户使用今天、昨天、本月、上周、最近一个月等相对日期时，必须按 Asia/Shanghai 解析为明确日期范围。"
      - "产品未指定时查询全部产品；结果最多返回 20 个候选。"
    data_scope: "BOILING_BATCH_LIST"

  query_production_order_progress:
    business_name: "生产订单当前进度"
    risk_level: "L1"
    owner_expert: "production_expert"
    can_answer:
      - "查询当前订单状态、计划摘要、领料/产出记录数、标签及二维码绑定和入库进度。"
    cannot_answer:
      - "当前数据库没有支撑产出率、损耗率或材料消耗差异的完整业务字段，不能计算这些指标。"
      - "不能表示质量放行或当前库存批次合格。"
    required_slots: ["order_ref"]
    dependencies: ["resolve_production_entities"]
    data_scope: "CURRENT_PRODUCTION_ORDER_PROGRESS"

  run_registered_report:
    business_name: "运行登记报表"
    risk_level: "L1"
    owner_expert: "analytics_expert"
    can_answer:
      - "按生产日期查询已登记且未取消的实际产出重量、板数、散件数、折算总件数、订单数和产品构成。"
      - "在最多 31 天的明确日期范围内返回逐日序列，并单独展示二维码绑定和入库进度。"
      - "按化验生产日期查询已登记化验的合格、不合格、无标准、标准多候选、明确判定合格率、产品构成和历史采用标准版本。"
      - "化验趋势最多查询 366 天；31 天以内按日、超过 31 天按月展示。"
      - "查询七个登记化验指标之一的样本数、均值、中位数、极值、P10/P90、时间序列和历史标准下的指标达标率。"
      - "查询实际领料和稳定登记产出的两条独立日历序列，并按订单展示输入/稳定产出登记完整性；最长 366 天。"
      - "查询系统已登记托盘任务的完成耗时、进行中等待、取消数量、按日序列和任务类型分布；最长 366 天。"
      - "在最多 31 天范围内查询产品总库存的期初、期末、净变化、逐日水平和产品分解；生产使用可信日终快照，本地/UAT 可显式使用历史回放模拟。"
      - "查询北京时间今天的运营概览，组合今日稳定登记产出、今日化验、今日确认领用与稳定产出两条独立序列、当前库存、今日创建托盘任务和当前待处理任务。"
    cannot_answer:
      - "不能把标签、二维码绑定或入库数量解释为产量。"
      - "不能计算尚未登记的计划达成率、班次对比、良率、损耗率、预测或经营结论。"
      - "不能把无标准、标准多候选或缺少判定计入化验合格率分母。"
      - "不能用当前标准重算历史化验判定，也不能从已有化验记录推断历史缺化验批次。"
      - "不能把无历史标准或单位不可比的样本计入指标达标率，也不能在小样本下断言改善、恶化或原因。"
      - "成品订单领用在确认时同步扣减库存；但领用确认时间与产出生产日期不能直接相除，当前也不能生成产耗比、收率或损耗率。"
      - "不能通过计划产出字段把尚无稳定登记产出的订单猜测归属到产品筛选范围。"
      - "不能把托盘任务耗时扩展为 SLA 逾期、员工绩效、责任归因或现场全部流程效率。"
      - "不能把本地历史回放模拟表述为真实日终快照、生产可发布数据或历史库位分布，不能据库存变化推断原因或预测未来。"
      - "不能把今日运营概览中的当前库存说成今日库存变化，也不能把今日创建任务与当前全部待处理任务混为同一范围。"
      - "不能运行任意报表标识、任意 SQL 或自由组合业务工具。"
    required_slots: ["report_definition_id", "report_version", "start_date", "end_date"]
    optional_slots: ["product_query", "metric_key", "task_type"]
    constraints:
      - "reportDefinitionId 只允许 daily_production_overview_v1、inventory_level_trend_v1、quality_assay_result_trend_v1、quality_metric_trend_v1、production_input_output_flow_v1、pallet_task_cycle_time_v1 或 today_operations_overview_v1，reportVersion 固定为 1。"
      - "today_operations_overview_v1 的开始和结束日期必须都是北京时间今天；首版不接受产品、指标、任务类型或跨期比较参数。"
      - "quality_metric_trend_v1 必须从登记的七个 metricKey 中选择一个；其他定义不得传 metricKey。"
      - "pallet_task_cycle_time_v1 只允许受控 taskType；INBOUND 表示半成品和成品入库任务。其他定义不得传 taskType。"
      - "生产日报和库存水平趋势最多 31 天；生产领料—登记产出、托盘任务周期和两类化验趋势最多 366 天；相对日期必须按 Asia/Shanghai 转成明确日期。"
      - "inventory_level_trend_v1 的生产查询范围必须完全落入连续通过守恒对账的可信日终窗口；本地历史回放必须显式开启，且不推进发布门禁。"
    permission: "生产日报要求 production:order:view；库存水平趋势要求 inventory:view；生产领料—登记产出同时要求 production:order:view 和 production:material:view；化验趋势要求 assay:view；托盘任务周期要求 task:view；今日运营概览同时要求上述五项只读权限；后端按报表定义再次校验。"
    data_scope: "REGISTERED_PRODUCTION_OUTPUT | TRUSTED_DAILY_CLOSE_SNAPSHOT | HISTORICAL_REPLAY_SIMULATION | REGISTERED_QUALITY_ASSAY | REGISTERED_QUALITY_ASSAY_METRIC | REGISTERED_PRODUCTION_INPUT_OUTPUT_FLOW | REGISTERED_PALLET_TASK_CYCLE_TIME | REGISTERED_TODAY_OPERATIONS_SNAPSHOT"

