      - "coverageType"
      - "totalGroups"
      - "groupCount"
    unsupported_alternatives:
      - "标准最近未使用和化验记录无标准覆盖待业务口径确认。"

  query_unqualified_inventory:
    business_name: "当前不合格库存查询"
    risk_level: "L1"
    owner_expert: "assay_expert"
    can_answer:
      - "查询当前仍在库、且产品 ID + 生产日期对应的最新版本化验明确判定为不合格的库存批次。"
      - "按全部库存、已确认产品或已确认库位范围返回库存数量、重量、库位、未达标指标和受控化验详情引用。"
    cannot_answer:
      - "无化验、无适用标准或标准多候选均不等同于不合格，不得并入结果。"
      - "不能使用 inventory.assay_id，不能由 Agent 分别查询库存和化验后自行拼接。"
      - "不能修改库存、化验或质量标准。"
    required_slots: ["product_scope", "warehouse_scope"]
    data_scope: "CURRENT_INVENTORY_WITH_LATEST_ASSAY"
    default_behavior: "固定 judgeStatus=FAIL、limit=50；只使用共享 inventory_current_assay_fact_v1 读模型。"
    examples:
      - input: "库存中有哪些不合格产品？"
        chain: "query_unqualified_inventory(productScope=ALL,warehouseScope=ALL)"

  query_inventory_by_quality_standard:
    business_name: "按质量标准筛选当前库存"
    risk_level: "L1"
    owner_expert: "assay_expert"
    can_answer:
      - "使用指定标准代码和版本，对当前库存批次最新化验逐项确定性匹配，返回满足该完整标准的库存。"
    cannot_answer:
      - "不能由 LLM 自行判断指标合格；不能猜测标准代码、版本或内部 ID。"
      - "匹配某标准表示实测指标满足该标准，不等同于该产品当前已绑定或该化验历史上采用了该标准。"
    required_slots: ["product_scope", "warehouse_scope", "standard_code"]
    dependencies: ["query_quality_standard_catalog"]
    data_scope: "CURRENT_INVENTORY_WITH_LATEST_ASSAY"
    default_behavior: "标准代码必须来自用户明确输入或质量标准目录；未指定版本时由后端解析当前启用版本。"
    examples:
      - input: "库存中哪些产品符合黄冰糖标准？"
        chain: "query_quality_standard_catalog -> query_inventory_by_quality_standard"

  query_inventory_by_assay_metrics:
    business_name: "按原始化验指标筛选当前库存"
    risk_level: "L1"
    owner_expert: "assay_expert"
    can_answer:
      - "按一个封闭指标和 GT/GTE/LT/LTE/EQ/BETWEEN 数值条件筛选当前库存批次最新化验。"
    cannot_answer:
      - "不支持任意字段、任意 SQL、公式或由模型计算的质量结论。"
      - "指标条件命中只说明原始数值满足筛选条件，不自动表示符合任何完整质量标准。"
    required_slots: ["product_scope", "warehouse_scope", "metric_condition"]
    data_scope: "CURRENT_INVENTORY_WITH_LATEST_ASSAY"
    default_behavior: "仅支持色值、还原糖分、干燥失重、电导灰分、蔗糖分、不溶于水杂质和 pH；limit=50。"
    examples:
      - input: "库存中哪些产品蔗糖分不低于 99.7？"
        chain: "query_inventory_by_assay_metrics(metricCode=sucrose,operator=GTE,value=99.7)"

  query_qr_code_lifecycle:
    business_name: "二维码 / 托盘生命周期查询"
    risk_level: "L1"
    can_answer:
      - "查询明确二维码或托盘码的当前状态、库存、化验、打印信息和安全流转时间线。"
      - "说明当前状态、库位、数量和风险标签。"
    cannot_answer:
      - "不能作废、恢复、重新绑定或修改托盘码。"
      - "不能编造不存在的二维码或生命周期事件。"
    use_when:
      - "用户提供明确二维码 / 托盘码并询问生命周期、经历环节或流转过程。"
    do_not_use_when:
      - "用户只问托盘当前状态且不需要完整时间线，可使用 get_pallet_status。"
    required_slots:
      - "code"
    optional_slots:
      - "include_inventory"
      - "include_assay"
      - "include_flows"
      - "include_print_info"
      - "flow_limit"
    resolver_for: []
    main_query_for: []
    default_behavior: "只接受用户明确提供的二维码 / 托盘码；默认返回库存、化验和流转摘要，不返回内部 ID。"
    examples:
      - input: "查询托盘码 P202607090001 的生命周期"
        chain: "query_qr_code_lifecycle(code=P202607090001)"
    safe_result_summary:
      - "codeLabel"
      - "currentStatusLabel"
      - "warehouseLabel"
      - "quantityText"
      - "timeline"
      - "riskLabels"
    unsupported_alternatives:
      - "作废或恢复二维码需要未来的 preview / execute 写操作链路。"

  query_printed_not_inbound_codes:
    business_name: "已打印未入库二维码查询"
    risk_level: "L1"
    can_answer:
      - "统计已打印标签批次中尚未完成入库的二维码数量和分组。"
      - "按产品、订单、批次和日期范围给出未入库数量及比例。"
    cannot_answer:
      - "不能把没有打印记录的数据推断为已打印。"
      - "不能修改标签状态或执行入库。"
    use_when:
      - "用户问哪些码打印了但没入库、打印批次还有多少未入库。"
    do_not_use_when:
      - "用户问某个码的完整流转过程，使用 query_qr_code_lifecycle。"
    required_slots: []
    optional_slots:
      - "product_scope"
      - "order_no"
      - "batch_no"
      - "date_range"
      - "group_by"
      - "limit"
    resolver_for:
      - "resolve_products"
    main_query_for:
      - "resolve_products"
    default_behavior: "默认全部产品、最近30天、按标签批次分组、limit=50；第一版打印口径为标签批次 printed_at，入库口径为输出码已关联库存、存在入库时间或状态为 INSTOCK。"
    examples:
      - input: "哪些码打印了但没入库？"
        chain: "query_printed_not_inbound_codes(productScope=ALL,dateRange=LAST_DAYS(30),groupBy=batch)"
    safe_result_summary:
      - "scopeLabel"
      - "dateRangeLabel"
      - "totalPrinted"
      - "totalInbound"
      - "totalNotInbound"
      - "completionRateText"
      - "groups"
    unsupported_alternatives:
      - "实际入库或补打标签需要未来写操作流程。"

  query_pallet_anomalies:
    business_name: "托盘生命周期异常查询"
    risk_level: "L1"
    can_answer:
      - "聚合二维码 / 托盘码、库存和流转之间的状态不一致、重复入库、无入库出库和产品绑定不一致。"
      - "按产品、库位、日期和异常类型返回分组及证据摘要。"
    cannot_answer:
      - "当前没有独立二维码扫描日志，不能断言发生过作废码扫描。"
      - "不能自动修复状态或回滚库存。"
    use_when:
      - "用户问托盘异常、二维码异常、状态与库存不一致或重复入库。"
    do_not_use_when:
      - "用户只问某个码的正常生命周期，使用 query_qr_code_lifecycle。"
    required_slots: []
    optional_slots:
      - "product_scope"
      - "warehouse_id"
      - "date_range"
      - "anomaly_types"
      - "limit"
    resolver_for:
      - "resolve_products"
      - "resolve_warehouses"
    main_query_for:
      - "resolve_products"
      - "resolve_warehouses"
    default_behavior: "默认全部产品、最近30天、返回已实现的四类可验证异常；VOID_CODE_SCANNED 返回扫描日志缺口说明。"
    examples:
      - input: "最近30天有哪些托盘异常？"
        chain: "query_pallet_anomalies(productScope=ALL,dateRange=LAST_DAYS(30))"
    safe_result_summary:
      - "scopeLabel"
      - "dateRangeLabel"
      - "groups"
      - "notes"
    unsupported_alternatives:
      - "状态修复、库存纠正和作废码处理需要审计确认及未来写操作链路。"

  query_pallet_flow_records:
    business_name: "托盘流转记录查询"
    risk_level: "L1"
    can_answer:
      - "按明确托盘码、产品、库位、日期和事件类型分页查询流转记录。"
      - "返回业务时间线、事件名称、来源和目的库位。"
      - "按已确认托盘查询最近流转或完整历史流转。"
    cannot_answer:
      - "不能修改流转记录或补写缺失事件。"
      - "不能把内部 flow ID 当作用户业务证据。"
    use_when:
      - "用户问托盘最近有哪些流转、托盘进出记录或二维码流转记录。"
      - "用户明确要求某托盘的完整、全部或所有历史流转。"
    do_not_use_when:
      - "用户需要单码完整摘要和风险标签，使用 query_qr_code_lifecycle。"
      - "用户只问托盘当前在哪、装了什么或当前状态，使用 get_pallet_status。"
    required_slots: []
    optional_slots:
      - "code"
      - "product_scope"
      - "warehouse_id"
      - "date_range"
      - "event_types"
      - "page"
      - "size"
    resolver_for:
      - "resolve_products"
      - "resolve_warehouses"
    main_query_for:
      - "resolve_products"
      - "resolve_warehouses"
    default_behavior: "默认最近30天、第一页20条；事件类型使用受控枚举并按时间倒序。用户明确要求完整历史时，Runtime 将日期规范化为受控全量范围，并只向用户展示‘完整历史’。"
    examples:
      - input: "托盘最近有哪些流转？"
        chain: "query_pallet_flow_records(productScope=ALL,dateRange=LAST_DAYS(30),page=1,size=20)"
    safe_result_summary:
      - "scopeLabel"
      - "dateRangeLabel"
      - "total"
      - "page"
      - "size"
      - "records"
    unsupported_alternatives:
      - "审计日志和操作人责任追踪需要 search_operation_logs 或后续审计工具。"

  query_qr_batch_inbound_completion:
    business_name: "二维码批次入库完成率查询"
    risk_level: "L1"
    can_answer:
      - "按标签批次、生产订单、产品或日期范围统计打印数量、入库数量、未入库数量和完成率。"
      - "在需要时列出少量未完成二维码示例。"
    cannot_answer:
      - "不能在没有批次、订单、产品或日期范围时猜测统计范围。"
      - "不能补入库或修改批次状态。"
    use_when:
      - "用户问某二维码批次、打印批次或订单标签的入库完成率。"
    do_not_use_when:
      - "用户问具体未入库码列表，使用 query_printed_not_inbound_codes。"
    required_slots:
      - "batch_or_order_or_product_or_date_scope"
    optional_slots:
      - "batch_no"
      - "order_no"
      - "product_id"
      - "date_range"
      - "include_unfinished_examples"
      - "limit"
    resolver_for:
      - "resolve_products"
    main_query_for:
      - "resolve_products"
    default_behavior: "必须至少提供批次号、订单号、已确认产品或日期范围；默认返回未完成示例，limit=20。"
    examples:
      - input: "批次 LB-001 入库完成率"
        chain: "query_qr_batch_inbound_completion(batchNo=LB-001)"
    safe_result_summary:
      - "scopeLabel"
      - "printedCount"
      - "inboundCount"
      - "notInboundCount"
      - "completionRateText"
      - "unfinishedExamples"
    unsupported_alternatives:
      - "批次补录、重打和回收需要未来写操作安全链路。"

write_operation_boundary:
  current_behavior: "识别写操作并说明边界，不执行写入。"
  future_required_flow:
    - "resolver / 信息补全"
    - "preview"
    - "用户确认"
    - "executionToken"
    - "idempotencyKey"
    - "execute"
    - "审计"
  forbidden_now:
    - "入库"
    - "出库"
    - "调拨"
    - "改库存"
    - "新增或修改产品"
    - "写入或修改化验"
    - "修改质量指标或质量标准"
    - "创建或修改生产订单"
    - "任意 SQL"
    - "任意 HTTP 代理"
