registryVersion: business-rule-roadmap-2026-07-13
status: DESIGN_ONLY
runtimeEnabled: false
decisionAuthority: DETERMINISTIC_RULE_ENGINE
llmFinalDecisionAllowed: false
wikiRole: "解释规则、术语、来源和示例；不执行规则，不签发业务决策。"

ruleContract:
  requiredFields:
    - ruleId
    - version
    - owner
    - status
    - inputSchemaVersion
    - outputDecisionEnum
    - reasonCodes
    - effectiveFrom
    - effectiveTo
    - priority
    - implementationHash
    - testSetHash
  lifecycle: [DRAFT, APPROVED, ACTIVE, DEPRECATED, RETIRED, BLOCKED]
  previewExecuteRule: "preview 保存规则版本；execute 使用同版本重算。版本不可用、发生漂移或 decision 改变时拒绝并要求重新 preview。"

