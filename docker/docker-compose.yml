version: '3.8'
services:
  backend:
    build: ../../../Users/Mrcury/Downloads
    container_name: sugar-backend
    network_mode: "host"
    environment:
      TZ: Asia/Shanghai

  frontend:
    build: ../frontend
    container_name: sugar-frontend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../frontend/cert/:/etc/nginx/cert

  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - app-network
    volumes:
      - redis_data:/data
    restart: always
    ports:
      - "6379:6379"

  clash:
    image: dreamacro/clash
    container_name: clash
    networks:
      - app-network
    volumes:
      - ./clash-config:/etc/clash
    ports:
      - "7890:7890"  # 根据需要配置端口
    restart: always
networks:
  app-network:
