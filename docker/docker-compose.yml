version: '3.8'
services:
  backend:
    build: ../../../Users/Mrcury/Downloads
    container_name: sugar-backend
    network_mode: "host"
    environment:
      TZ: Asia/Shanghai

  frontend:
    build: ../frontend
    container_name: sugar-frontend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../frontend/cert/:/etc/nginx/cert

  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - app-network
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  clash:
    image: dreamacro/clash
    container_name: clash
    networks:
      - app-network
    volumes:
      - ./clash-config:/etc/clash
    ports:
      - "7890:7890"  # 根据需要配置端口
    restart: always
networks:
  app-network:
secrets:
  redis_password:
    file: ${REDIS_PASSWORD_FILE:?Set REDIS_PASSWORD_FILE to a protected secret file}
