<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微信授权测试</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f5f7fa; }
    main { text-align: center; background: white; padding: 32px 44px; border-radius: 18px; box-shadow: 0 12px 40px #0001; }
    img { width: min(58vh, 480px); height: min(58vh, 480px); image-rendering: pixelated; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 8px 0 20px; color: #52606d; }
    #state { margin-top: 16px; color: #1677ff; }
  </style>
</head>
<body>
  <main>
    <h1>请用手机微信扫一扫</h1>
    <p>二维码过期后会自动刷新，无需重新打开页面</p>
    <img id="qr" src="wechat-login-qr-live.png" alt="微信授权二维码">
    <div id="state">正在等待扫码确认……</div>
  </main>
  <script>
    const qr = document.querySelector('#qr');
    const state = document.querySelector('#state');
    async function refresh() {
      qr.src = `wechat-login-qr-live.png?t=${Date.now()}`;
      try {
        const result = await fetch(`weixin-login-status.json?t=${Date.now()}`);
        const data = await result.json();
        if (data.status === 'confirmed') state.textContent = '授权成功，可以返回 Codex';
        else if (data.status === 'refreshing') state.textContent = '二维码正在自动刷新……';
        else state.textContent = `正在等待扫码确认（第 ${data.generation} 个二维码）……`;
      } catch (_) {
        state.textContent = '正在生成二维码……';
      }
    }
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
