spring:
  aop:
    proxy-target-class: true
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/laibin?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 60000       # 连接最大存活时间（建议比 MySQL 的 wait_timeout 短，单位毫秒）
      connection-timeout: 30000 # 连接超时时间（毫秒）
      idle-timeout: 30000       # 空闲连接超时时间（毫秒）
      validation-timeout: 5000  # 连接验证超时时间（毫秒）
      leak-detection-threshold: 60000 # 检测连接泄漏（毫秒）
      connection-test-query: SELECT 1  # MySQL 连接测试语句
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  jackson:
    mapper:
      sort-properties-alphabetically: false
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
      order-map-entries-by-keys: false
knife4j:
  enable: true
springdoc:
  api-docs.enabled: true
  swagger-ui.enabled: true
server:
  port: 8080
wechat:
  appid: ${WECHAT_APP_ID:}
  secret: ${WECHAT_APP_SECRET}
openai:
  api-url: ${OPENAI_API_URL:https://api.deepseek.com}
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:deepseek-v4-flash}
  max-tokens: 8192
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
user:
  dir: D:\\Laibin\\LaibinSugarInventory
file:
  export-dir: D:\\Laibin\\Files
  base-url: https://cscgood.mynatapp.cc
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    auto-mapping-behavior: full
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    org.springframework.aop: DEBUG
  type-handlers-package: com.Laibin.SugarInventory.util
  global-config:
    db-config:
      logic-delete-field: deleted
      id-type: auto
inventory:
  history:
    daily-snapshot-cron: ${INVENTORY_HISTORY_DAILY_SNAPSHOT_CRON:0 0 0 * * ?}
    max-capture-delay-minutes: ${INVENTORY_HISTORY_MAX_CAPTURE_DELAY_MINUTES:10}
analytics:
  inventory-trend:
    simulation-enabled: ${INVENTORY_TREND_SIMULATION_ENABLED:false}
agent:
  mcp:
    runtime-verification-enabled: ${AGENT_MCP_RUNTIME_VERIFICATION_ENABLED:true}
    warmup-enabled: ${AGENT_MCP_WARMUP_ENABLED:true}
    warmup-core-pool-size: ${AGENT_MCP_WARMUP_CORE_POOL_SIZE:1}
    warmup-max-pool-size: ${AGENT_MCP_WARMUP_MAX_POOL_SIZE:2}
    warmup-queue-capacity: ${AGENT_MCP_WARMUP_QUEUE_CAPACITY:8}
  entity-ref:
    secret: ${AGENT_ENTITY_REF_SECRET:}
    ttl-seconds: ${AGENT_ENTITY_REF_TTL_SECONDS:600}
  internal-tool:
    service-key: ${AGENT_INTERNAL_TOOL_SERVICE_KEY:}
    max-arguments-bytes: ${AGENT_INTERNAL_TOOL_MAX_ARGUMENTS_BYTES:16384}
  runtime:
    mode: ${AGENT_RUNTIME_MODE:python}
    python-base-url: ${AGENT_PYTHON_BASE_URL:http://localhost:8091}
    # Python LLM turns have a 90s run budget; keep the Java transport above it
    # so the controlled timeout/final event can reach the browser.
    python-timeout-ms: ${AGENT_PYTHON_TIMEOUT_MS:100000}
    python-service-key: ${AGENT_PYTHON_SERVICE_KEY:}
    fallback-enabled: ${AGENT_RUNTIME_FALLBACK_ENABLED:false}
